schema_version: 1

context:
  name: sphinxcontrib-httpdomain
  version: 2.2.1

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name | replace('-', '_') }}-${{ version }}.tar.gz
  sha256: a2710c982476974288cb41044acf26334468aa85e73015e87a1294c62d93f114

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - uv-build >=0.12.22,<0.14.0   # replaces setuptools
  run:
    - python >=${{ python_min }}
    - sphinx >=8.1.3
tests:
  - python:
      imports:
        - sphinxcontrib
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  license: BSD-2-Clause
  license_file: LICENSE
  summary: Sphinx domain for describing HTTP APIs
  description: |
    This contrib extension, `sphinxcontrib.httpdomain¡, provides a Sphinx domain
    for describing HTTP APIs.
  homepage: https://github.com/sphinx-contrib/httpdomain
  repository: https://github.com/sphinx-contrib/httpdomain
  documentation: https://sphinxcontrib-httpdomain.readthedocs.io/en/stable/

extra:
  recipe-maintainers:
    - conda-forge/sphinx
    - carlodri
