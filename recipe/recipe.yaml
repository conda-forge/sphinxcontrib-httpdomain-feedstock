schema_version: 1

context:
  name: sphinxcontrib-httpdomain
  version: 2.1.0

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name | replace('-', '_') }}-${{ version }}.tar.gz
  sha256: 889d7f69b55633e22a28a8222c4952df65f707e0a9a157f38729625a33ea5d5b

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - sphinx >=8.1.3
tests:
  - python:
      imports:
        - sphinxcontrib
      python_version: ${{ python_min }}.*
about:
  license: BSD-2-Clause
  license_file: LICENSE
  summary: Sphinx domain for describing HTTP APIs
  description: |
    This contrib extension, `sphinxcontrib.httpdomain¡, provides a Sphinx domain
    for describing HTTP APIs.
  homepage: https://github.com/sphinx-contrib/httpdomain
  repository: https://github.com/sphinx-contrib/httpdomain
  documentation: https://sphinxcontrib-httpdomain.readthedocs.io/en/stable/

extra:
  recipe-maintainers:
    - conda-forge/sphinx
    - carlodri
